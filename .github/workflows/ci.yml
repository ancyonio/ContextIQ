name: CI

# The project's whole claim is "fewer tokens, same answer quality". Nothing
# enforced the second half before: CI ran only the AI-config linter, so a
# retrieval regression that silently stopped surfacing the right symbols would
# have shipped green. This workflow runs the unit tests AND the answer-quality
# gate across every fixture repository.

on:
  pull_request:
  push:
    branches: [main]
  # The LLM-judged evaluation below costs real API spend, so it cannot run on
  # every push — but "too expensive for every PR" had quietly become "never
  # runs at all", leaving the project's central claim untested. A weekly
  # schedule plus manual dispatch is the compromise: routine, bounded, and
  # visible when it regresses.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI on the deterministic hash backend: identical scores on every
  # runner, no model download, no network dependency in the gate.
  TOKENGRAPH_EMBEDDINGS: "off"
  TOKENGRAPH_NO_TRACK: "1"

jobs:
  test:
    name: tests (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . || pip install pytest

      - name: Unit tests
        run: python -m pytest tests/ -q

  quality-gate:
    name: retrieval answer-quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . || true
          pip install tiktoken

      - name: Extractor self-test
        run: python tokengraph_all.py diagnose-extractors

      # Fails the build when recall, symbol coverage or answerability drops
      # below the floors in BENCHMARK_THRESHOLDS.
      - name: Answer-quality gate
        run: python tokengraph_all.py benchmark --check

      - name: Full benchmark report
        if: always()
        run: python tokengraph_all.py benchmark --all --json > benchmark.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: benchmark.json

  ai-config:
    name: AI config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_ai_config.py

      - name: Pricing review window
        # Built-in list prices go stale silently. This fails the build when a
        # vendor family passes its review window, so the catalogue is refreshed
        # deliberately instead of rotting until someone notices a wrong quote.
        run: python tokengraph_all.py pricing --check

  llm-quality:
    name: LLM answer-quality (pack vs full source)
    # Weekly and on demand only — every run makes paid API calls. Skipped
    # automatically when no key is configured, so forks stay green.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . || true
          pip install tiktoken anthropic

      - name: Guard — API key present
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "no ANTHROPIC_API_KEY configured; skipping the paid evaluation"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Answers each held-out question twice — once from the ContextIQ pack,
      # once from the full source — and gates on quality_retention. This is the
      # only check that tests "fewer tokens, same answer" directly.
      - name: Pack-vs-full-source evaluation
        if: steps.key.outputs.present == 'true'
        run: >
          python tokengraph_all.py judge-eval --check
          -o judge-eval.json --json

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: judge-eval-report
          path: |
            judge-eval.json
            .context/judge-eval.json
